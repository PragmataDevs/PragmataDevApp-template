# supabase/config.toml — Pragmata Template
# ──────────────────────────────────────────────────────────────
# Referencia del proyecto Supabase para el CLI local y deploy.
# Documentación: https://supabase.com/docs/reference/cli/config
#
# Múltiples copias en la misma máquina: cada repo puede usar otros puertos
# (API, DB, shadow, Studio, Inbucket, analytics, db.pooler). Guía + tabla Studio por cliente:
#   docs/supabase-local-copias-y-studio.md
#
# SETUP INICIAL:
#   1. supabase login
#   2. supabase link --project-ref <tu_project_ref>
#      (el project_ref es el código de tu URL: https://<ref>.supabase.co)
#   3. supabase functions deploy <nombre>
# ──────────────────────────────────────────────────────────────

[api]
# El puerto local del API (para desarrollo con supabase start)
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

# Logflare/analytics: disabled por defecto en local (menos contenedores y health checks más estables).
# Con varios proyectos en la misma máquina, fijá port = API+6 si lo habilitás (allocator de Factory lo mantiene).
[analytics]
enabled = false
port = 54327

[db.pooler]
enabled = false
port = 54329

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:7070"
# Lista de URLs permitidas para redireccionamiento (ERP :7070, Astro :4321 en dev)
additional_redirect_urls = [
  "http://localhost:7070/**",
  "http://127.0.0.1:7070/**",
  "http://localhost:7070/auth/callback",
  "http://127.0.0.1:7070/auth/callback",
  "http://localhost:7070/auth/reset-password",
  "http://127.0.0.1:7070/auth/reset-password",
  "http://localhost:5173/auth/callback",
  "https://app.tucliente.com/auth/callback",
  "https://app.tucliente.com/auth/reset-password"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Plantillas HTML — se cargan al `supabase start` (ruta relativa a la raíz del repo).
# Probar en local: Mailpit http://127.0.0.1:54324
# Ver docs/auth-email-templates-local.md

[auth.email.template.recovery]
subject = "Restablece tu contraseña — PragmataDevs"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "Establece tu contraseña — PragmataDevs"
content_path = "./supabase/templates/invite.html"

# ── Edge Functions (local: supabase functions serve; nube: supabase functions deploy) ──
# verify_jwt por función — local respeta config.toml al hacer `supabase functions serve`.
# Ver docs/proceso-post-migraciones-scripts-y-funciones-local.md (local)

[functions.create-auth-user]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# Secrets en nube: supabase secrets set OPENAI_API_KEY=sk-...
# Local: opcional en supabase/.env.local o --env-file al hacer functions serve
#   OPENAI_API_KEY            → ai-task-summary, ai-gateway
#   STRIPE_SECRET_KEY         → stripe-checkout, stripe-webhook
#   STRIPE_WEBHOOK_SECRET     → stripe-webhook
#   PUBLIC_SITE_URL           → stripe-checkout (redirect URLs)
